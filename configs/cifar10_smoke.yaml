# CPU / single-GPU smoke test. Does not match Table 1.
seed: 0
method: fm_ot
model:
  preset: tiny
  num_classes: 10
path:
  sigma_min: 0.0
  beta_min: 0.1
  beta_max: 20.0
  time_eps: 1.0e-5
train:
  iterations: 2
  batch_size: 2
  accum_steps: 1
  lr: 5.0e-4
  min_lr: 1.0e-8
  warmup_steps: 1
  class_drop_prob: 0.5
  ema_decay: 0.9999
  log_every: 1
  ckpt_every: 1
data:
  root: data/cifar10
  download: false
  random_flip: false
  num_workers: 0
eval:
  num_samples: 4
  batch_size: 2
  solver: euler
  atol: 1.0e-5
  rtol: 1.0e-5
  cfg_scale: 0.0
